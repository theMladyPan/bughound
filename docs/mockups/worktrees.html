<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bughound · Activity timeline preview</title>
<style>
:root {color-scheme:dark;--bg:#0d1117;--drawer:#0a0f16;--card:#161b22;--head:#1c2128;--border:#30363d;--text:#e6edf3;--muted:#9da6b1;--accent:#58a6ff;--green:#7ee08c;--amber:#e3b341;--red:#ff9189;--violet:#d2a8ff;--mono:ui-monospace,SFMono-Regular,Menlo,monospace}
* {box-sizing:border-box}
[hidden] {display:none!important}
body {margin:0;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,sans-serif}
h1,h2,h3,p {margin:0}
button {font:inherit;color:inherit;cursor:pointer}
button:focus-visible {outline:2px solid var(--accent);outline-offset:-2px}
code {font-family:var(--mono)}
.shell {border-bottom:1px solid var(--border);background:var(--card);padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font:12px var(--mono)}
.brand {font-weight:750;font-size:16px}
.board {padding:3px 8px;border:1px solid var(--border);border-radius:5px;background:var(--head)}
.board b {color:var(--accent)}
.tag {margin-left:auto;color:var(--amber)}
.board-sample {flex:1;min-height:116px;padding:18px 14px;display:flex;align-content:flex-start;align-items:flex-start;gap:12px;flex-wrap:wrap;background-color:var(--drawer);background-image:radial-gradient(circle at 1px 1px,#21262d 1px,transparent 0);background-size:20px 20px}
.board-sample article {width:250px;max-width:100%;border:1px solid var(--border);border-radius:6px;background:var(--card)}
.board-sample h2 {padding:5px 9px;background:var(--head);border-radius:5px 5px 0 0;font:12px var(--mono)}
.board-sample p {padding:7px 9px;font-size:12px;color:var(--muted)}
.dock {border-top:1px solid #3d444d;box-shadow:0 -12px 34px #0006}
.dock-bar {min-height:40px;display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:6px 14px;border-bottom:1px solid var(--border);font:11px var(--mono);color:var(--muted)}
.dock-bar h1 {font:12px var(--mono);color:var(--text)}
.dock-bar button {margin-left:auto;padding:4px 8px;background:var(--card);border:1px solid var(--border);border-radius:6px}
.dock-body {display:grid;grid-template-columns:minmax(0,1.618fr) minmax(0,1fr);height:clamp(280px,40dvh,380px)}
.summary {display:flex;gap:7px;flex-wrap:wrap;padding:12px 14px;background:var(--drawer);border-bottom:1px solid var(--border)}
.pill {display:inline-flex;align-items:center;gap:6px;padding:3px 7px;border:1px solid var(--border);border-radius:4px;background:var(--bg);font:11px/1.3 var(--mono)}
.mark {height:8px;width:8px;border-radius:50%;background:currentColor;display:inline-block;flex:none}
.scan {color:var(--accent)} .settle {color:var(--amber)} .run {color:var(--violet)} .idle {color:var(--muted)} .fail {color:var(--red)} .pass {color:var(--green)}
.timeline {--lane-height:44px;display:flex;flex-direction:column;height:100%;min-height:0;background:var(--drawer)}
.lane-region {display:flex;flex-direction:column;flex:1;min-height:0;padding:9px 14px}
.lane-head {display:grid;grid-template-columns:clamp(136px,24%,220px) minmax(0,1fr);height:20px;flex:none}
.lane-scroll {display:grid;grid-template-columns:clamp(136px,24%,220px) minmax(0,1fr);grid-template-rows:repeat(4,var(--lane-height));flex:1;min-height:0;align-content:start;overflow-y:auto;overflow-x:hidden;scrollbar-width:auto;scrollbar-color:#30363d transparent}
.lane-scroll:focus-visible {outline:2px solid var(--accent);outline-offset:-2px}
.lane-scroll::-webkit-scrollbar {width:10px}
.lane-scroll::-webkit-scrollbar-thumb {background:#30363d;border-radius:5px}
.plot {grid-column:2;grid-row:1 / span 4;position:relative;width:100%;height:calc(4 * var(--lane-height))}
.ticks {height:20px;display:flex;justify-content:space-between;color:var(--muted);font:10px var(--mono);gap:4px}
.plot-tracks {height:calc(4 * var(--lane-height));position:relative}
.failure-dot {position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;padding:0;border:0;border-radius:50%;background:transparent;display:grid;place-items:center}
.failure-dot::before {content:'';width:12px;height:12px;border:2px solid var(--drawer);border-radius:50%;background:var(--red)}
.failure-dot:hover::before,.failure-dot[aria-pressed="true"]::before {outline:1px solid var(--red);outline-offset:2px}
.track-label {grid-column:1;height:var(--lane-height);display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:center;column-gap:4px;min-width:0;border:0;border-left:2px solid var(--border);background:transparent;text-align:left;padding:4px 7px;color:var(--text);font-size:11px}
.track-label[aria-pressed="true"] {border-color:var(--accent);background:#101e30}
.track-label span {font:10px var(--mono)}
.track-label .track-id {grid-column:2;grid-row:1;color:var(--muted)}
.track-label span:last-child {grid-column:1 / -1;margin-top:2px}
.timeline-legend {grid-column:1 / -1;display:flex;gap:8px 12px;flex-wrap:wrap;margin:10px 0 0;color:var(--muted);font:10px var(--mono)}
.timeline-legend span {display:inline-flex;gap:5px;align-items:center}
.timeline-legend i {display:inline-block;width:11px;height:4px;background:currentColor}
.timeline-legend .mark {width:10px;height:10px;border:1px solid var(--drawer);outline:1px solid currentColor}
#timeline-art {display:block;width:100%;height:100%}
.caption {padding:6px 14px;color:var(--muted);border-top:1px solid var(--border);font-size:12px}
.detail {min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.card-head {display:flex;align-items:center;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;padding:8px 14px;background:var(--head);border-bottom:1px solid var(--border)}
.card-head h2 {font-size:14px}
.card-head small {color:var(--muted);font:11px var(--mono)}
.test-log {flex:1;min-height:0;max-height:285px;margin:0;padding:10px 12px;overflow:auto;background:var(--drawer);font:11px/1.55 var(--mono);tab-size:4}
.test-log:focus-visible {outline:2px solid var(--accent);outline-offset:-2px}
@media(max-width:710px) {
  .dock-body {grid-template-columns:minmax(0,1fr);height:auto}
  .detail {border-left:0;border-top:1px solid var(--border)}
  .timeline {height:auto}
  .lane-region {padding-inline:8px}
  .lane-head,.lane-scroll {grid-template-columns:112px minmax(0,1fr)}
  .track-label {display:block}
  .track-label span {display:block}
  .track-label .track-id {font-size:9px}
}
</style>
</head>
<body>
<header class="shell"><span class="brand">pi</span><span class="board">board of <b>pi-studio</b></span><span class="tag">● Simulated preview</span></header>
<main class="board-sample" aria-label="Sample pi-studio board">
  <article><h2>● Release 0.7.0</h2><p>Thread <code>1e724a28</code></p></article>
  <article><h2 class="fail">● Bughound: 1 failure</h2><p>Plugin panel · example thread</p></article>
</main>
<section class="dock" aria-labelledby="dock-title">
  <header class="dock-bar"><h1 id="dock-title">Bughound activity timeline</h1><button id="dock-toggle" type="button" aria-controls="dock-body" aria-expanded="true">Roll down</button></header>
  <div class="dock-body" id="dock-body">
    <section id="timeline" class="mock-motion timeline" aria-label="Last 60 seconds of simulated activity, zoomable to 30 minutes" title="Scan (blue) · Settle (yellow) · Run (violet) · Pass (green) · Failure (red)">
      <div class="lane-region">
        <div class="lane-head" aria-hidden="true"><span></span><div class="ticks" id="ticks"><span>−60s</span><span>−40s</span><span>−20s</span><span>Now</span></div></div>
        <div class="lane-scroll" id="plot-scroll" tabindex="0" aria-label="Worktree lanes. Mouse wheel scrolls the lanes or zooms the plot.">
          <div class="plot" id="plot">
            <div class="plot-tracks" id="plot-tracks"><canvas id="timeline-art" aria-hidden="true"></canvas></div>
          </div>
        </div>
      </div>
      <noscript><p class="caption">Enable JavaScript to view the timeline.</p></noscript>
    </section>
    <section class="detail" aria-labelledby="detail-heading">
      <div class="card-head"><h2 id="detail-heading">Selected check</h2><small id="log-context" aria-live="polite"></small></div>
      <pre class="test-log" id="log" tabindex="0" aria-label="Simulated pytest output"></pre>
    </section>
  </div>
</section>
<script>
'use strict';
const $ = id => document.getElementById(id);
const phase = {scan:'Scanning',settle:'Edits settling',run:'Running checks',idle:'Idle',pass:'Passed'};
const color = {scan:'#58a6ff',settle:'#e3b341',run:'#d2a8ff',pass:'#7ee08c'};
const workspaceFailure = {time:1755,test:'tests/test_workspace.py::test_discovers_enabled_suites',log:`F                                                                [100%]
=============================== FAILURES ===============================
____________________ test_discovers_enabled_suites _____________________
tests/test_workspace.py:3: in test_discovers_enabled_suites
    assert suites == ["pytest", "node --test"]
E   AssertionError: assert ['pytest'] == ['pytest', 'node --test']
E
E     Right contains one more item: 'node --test'
E     Use -v to get more diff
======================= short test summary info ========================
FAILED tests/test_workspace.py::test_discovers_enabled_suites - Asser...
1 failed in 0.02s`};
const panelFailure = {time:1779,test:'tests/test_panel.py::test_restores_focus_on_reopen',log:`F                                                                [100%]
=============================== FAILURES ===============================
____________________ test_restores_focus_on_reopen _____________________
tests/test_panel.py:3: in test_restores_focus_on_reopen
    assert focus_target == "panel-trigger"
E   AssertionError: assert 'board' == 'panel-trigger'
E
E     - panel-trigger
E     + board
======================= short test summary info ========================
FAILED tests/test_panel.py::test_restores_focus_on_reopen - Assertion...
1 failed in 0.02s`};
const data = [
  {id:'root',name:'Workspace root',stage:'scan',result:'Passed',log:'.                                                                [100%]\n1 passed in 0.02s',events:[[1744,1749,'scan'],[1749,1755,'run'],[1764,1771,'run'],[1771,1774,'pass'],[1793,1800,'scan']],failures:[workspaceFailure]},
  {id:'1e724a28',name:'Release 0.7.0',stage:'settle',result:'No run yet',log:'No check output yet.',events:[[1788,1793,'scan'],[1793,1800,'settle']],failures:[]},
  {id:'example-a',name:'Board shortcuts',stage:'run',result:'Passed',log:'...                                                              [100%]\n3 passed in 0.03s',events:[[1745,1750,'scan'],[1750,1758,'run'],[1758,1761,'pass'],[1777,1783,'scan'],[1783,1790,'settle'],[1790,1800,'run']],failures:[]},
  {id:'example-b',name:'Plugin panel',stage:'idle',result:'1 failure',log:panelFailure.log,events:[[1750,1755,'scan'],[1755,1760,'settle'],[1760,1779,'run']],failures:[panelFailure]}
];
const TOTAL_SECONDS = 1800, MIN_SECONDS = 60;
let selected = 'example-b', visibleSeconds = MIN_SECONDS, zoomTimer;
const buttons = [], markers = [];
for (const [i,d] of data.entries()) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'track-label';
  button.style.gridRow = i + 1;
  button.innerHTML = `${d.name}<span class="track-id">${i ? d.id : 'dev'}</span><span class="${d.stage}">${phase[d.stage]}</span>`;
  button.setAttribute('aria-label',`${d.name}, ${phase[d.stage]}, latest result: ${d.result}`);
  button.addEventListener('click',() => pick(d.id));
  buttons.push([button,d.id]);
  $('plot-scroll').append(button);
  for (const failure of d.failures) {
    const marker = document.createElement('button');
    marker.type = 'button';
    marker.className = 'failure-dot';
    marker.style.left = `clamp(13px, ${(failure.time - (TOTAL_SECONDS - visibleSeconds))/visibleSeconds*100}%, calc(100% - 13px))`;
    marker.style.top = `${(i+.5)/data.length*100}%`;
    marker.title = `${timeLabel(failure.time)} · ${failure.test}`;
    marker.setAttribute('aria-label',`${d.name}, failure detected at ${timeLabel(failure.time)}: ${failure.test}`);
    marker.addEventListener('click',() => pick(d.id,failure));
    markers.push([marker,failure]);
    $('plot-tracks').append(marker);
  }
}
function timeLabel(time) {
  const secondsAgo = Math.max(0,TOTAL_SECONDS-time);
  return secondsAgo === 0 ? 'Now' : `−${secondsAgo}s`;
}
function tickLabel(secondsAgo) { return secondsAgo === 0 ? 'Now' : `−${secondsAgo}s`; }
function updateTicks() {
  const [start,end] = windowRange();
  const ticks = $('ticks');
  for (let i=0;i<4;i++) {
    ticks.children[i].textContent = tickLabel(Math.max(0,Math.round(visibleSeconds*(1-i/3))));
  }
}
function windowRange() { return [TOTAL_SECONDS-visibleSeconds,TOTAL_SECONDS]; }
function updateMarkers() {
  const [start] = windowRange();
  for (const [marker,failure] of markers) {
    marker.style.left = `clamp(13px,${(failure.time-start)/visibleSeconds*100}%,calc(100% - 13px))`;
  }
}
function pick(id, clickedFailure) {
  selected = id;
  const d = data.find(d => d.id === id);
  for (const [button,key] of buttons) button.setAttribute('aria-pressed',String(key === id));
  for (const [marker,failure] of markers) marker.setAttribute('aria-pressed',String(failure === clickedFailure));
  $('log-context').textContent = `${d.name} · pytest · ${clickedFailure ? timeLabel(clickedFailure.time) : 'Latest run'}`;
  const log = $('log');
  log.textContent = clickedFailure ? clickedFailure.log : d.log;
  log.scrollTo(0,0);
  if (clickedFailure) $('detail-heading').scrollIntoView({block:'nearest',inline:'nearest'});
  drawTimeline();
}
function drawTimeline() {
  const c = $('timeline-art'), g = c.getContext('2d');
  if (!g) return;
  const {width,height} = c.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio || 1,2);
  const w = Math.round(width*dpr), h = Math.round(height*dpr);
  if (!w || !h) return;
  if (c.width !== w) c.width = w;
  if (c.height !== h) c.height = h;
  const [start,end] = windowRange();
  const px = value => (value-start)/(end-start)*w;
  g.clearRect(0,0,w,h);
  g.lineWidth = dpr;
  for (let i=0;i<=3;i++) {
    const x = Math.min(w-dpr,px(start + (end-start)*i/3)+dpr/2);
    g.strokeStyle = i === 3 ? '#596675' : '#30363d';
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();
  }
  for (const [i,d] of data.entries()) {
    const y = (i+.5)*h/data.length;
    g.fillStyle = d.id === selected ? '#142339' : '#161b22'; g.fillRect(0,y-13*dpr,w,26*dpr);
    for (const [from,to,s] of d.events) {
      const x = px(from), eventEnd = px(to);
      if (eventEnd <= 0 || x >= w) continue;
      g.fillStyle = color[s]; g.fillRect(x,y-4*dpr,Math.max(1,Math.min(eventEnd,w)-Math.max(x,0)-dpr),8*dpr);
    }
  }
  updateMarkers();
  updateTicks();
}
function changeZoom(nextSeconds) {
  visibleSeconds = Math.min(TOTAL_SECONDS,Math.max(MIN_SECONDS,nextSeconds));
  drawTimeline();
}
$('plot').addEventListener('wheel',event => {
  event.preventDefault();
  const nextVisibleSeconds = Math.min(TOTAL_SECONDS,Math.max(MIN_SECONDS,Math.round(visibleSeconds*(event.deltaY > 0 ? 2 : .5))));
  if (nextVisibleSeconds === visibleSeconds) return;
  changeZoom(nextVisibleSeconds);
  clearTimeout(zoomTimer);
  zoomTimer = setTimeout(drawTimeline,50);
},{passive:false});
$('dock-toggle').addEventListener('click',() => {
  const body = $('dock-body'), toggle = $('dock-toggle');
  body.hidden = !body.hidden;
  toggle.setAttribute('aria-expanded',String(!body.hidden));
  toggle.textContent = body.hidden ? 'Roll up' : 'Roll down';
  drawTimeline();
});
addEventListener('resize',drawTimeline);
pick(selected);
</script>
</body>
</html>
