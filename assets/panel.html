<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bughound</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="panel" aria-labelledby="panel-title">
    <header class="panel-head">
      <div class="title-block">
        <span class="dot" id="dot" aria-hidden="true"></span>
        <div class="title-copy">
          <h1 id="panel-title">Activity timeline</h1>
          <p id="meta" class="meta visually-hidden" role="status">waiting for the board</p>
        </div>
      </div>

      <div class="controls" aria-label="Bughound controls">
        <button type="button" id="runAll">run all</button>
        <button type="button" id="runFailed" hidden>rerun failed</button>
        <button type="button" id="pause">pause</button>
        <button type="button" id="copy">copy log</button>

        <details class="settings" id="settings">
          <summary>settings</summary>
          <div class="settings-panel">
            <div class="timings">
              <label>interval <input type="number" id="setInterval" min="250" step="250"></label>
              <label>debounce <input type="number" id="setDebounce" min="0" step="100"></label>
              <label>timeout <input type="number" id="setTimeout" min="1" step="10"></label>
              <label>depth cap <input type="number" id="setMaxHops" min="1" step="1"></label>
              <label><input type="checkbox" id="fullOnConfigChange"> full run on config change</label>
            </div>
            <button type="button" id="saveSettings">save timings</button>
            <p class="note" id="setNote" role="status"></p>
            <hr class="settings-rule">
            <p class="note" id="suitesTitle">Suites for this repo</p>
            <div class="suite-add">
              <button type="button" id="addPython">+ pytest</button>
              <button type="button" id="addNode">+ node --test</button>
              <button type="button" id="addCustom">+ custom command</button>
            </div>
            <div id="suiteList" class="suite-list"></div>
            <button type="button" id="saveSuites">apply suites</button>
            <p class="note" id="suitesNote" role="status">Select a worktree to set its suites.</p>
          </div>
        </details>
      </div>
    </header>

    <section class="panel-main">
      <section class="timeline-region" id="timelineRegion" aria-label="Worktree activity timeline" title="Scan (blue) · Settle (yellow) · Run (violet) · Pass (green) · Failure (red)">
        <div class="lane-head" aria-hidden="true">
          <span></span>
          <div class="ticks" id="ticks"><span>−60s</span><span>−40s</span><span>−20s</span><span>Now</span></div>
        </div>
        <div class="lane-scroll" id="laneScroll" tabindex="0" aria-label="Worktree lanes. Mouse wheel scrolls the lanes or zooms the plot.">
          <div class="vertical-splitter lane-splitter" id="laneSplitter" aria-hidden="true" title="Drag to resize worktree names"></div>
          <div class="plot" id="plot">
            <div class="plot-tracks" id="plotTracks">
              <canvas id="timelineArt" aria-hidden="true"></canvas>
            </div>
          </div>
        </div>
      </section>

      <div class="vertical-splitter selected-splitter" id="selectedSplitter" aria-hidden="true" title="Drag to resize Selected check"></div>
      <aside class="selected" id="selected" aria-labelledby="detailHeading">
        <div class="card-head">
          <h2 id="detailHeading">Selected check</h2>
          <small id="logContext" role="status"></small>
        </div>
        <pre class="test-log" id="log" tabindex="0" aria-label="Selected check log"></pre>
      </aside>
    </section>

    <p id="pending" class="pending" hidden></p>
  </main>
  <script src="panel.js"></script>
</body>
</html>
